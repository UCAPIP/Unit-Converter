<!-- Экран ввода данных -->
<div class="form-group">
    <label for="inputValue">Enter the length to convert</label>
    <input type="number" id="inputValue" value="20">
</div>

<div class="form-group">
    <label for="unitFrom">Unit to Convert from</label>
    <select id="unitFrom">
        <option value="mg" selected>milligram</option>
        <option value="g">gram</option>
        <option value="kg">kilogram</option>
        <option value="oz">ounce</option>
        <option value="lb">pound</option>
    </select>
</div>

<div class="form-group">
    <label for="unitTo">Unit to Convert to</label>
    <select id="unitTo">
        <option value="mg">milligram</option>
        <option value="g" selected>gram</option>
        <option value="kg">kilogram</option>
        <option value="oz">ounce</option>
        <option value="lb">pound</option>
    </select>
</div>

<button id="convertBtn">Convert</button>
