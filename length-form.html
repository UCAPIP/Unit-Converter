 <!-- Экран ввода данных -->
<div class="form-group">
    <label for="inputValue">Enter the length to convert</label>
    <input type="number" id="inputValue" value="20">
</div>

<div class="form-group">
    <label for="unitFrom">Unit to Convert from</label>
    <select id="unitFrom">
        <option value="mm" selected>millimeter</option>
        <option value="cm">centimeter</option>
        <option value="m">meter</option>
        <option value="km">kilometer</option>
        <option value="in">inch</option>
        <option value="ft">foot</option>
        <option value="y">yard</option>
        <option value="mi">mile</option>
    </select>
</div>

<div class="form-group">
    <label for="unitTo">Unit to Convert to</label>
    <select id="unitTo">
        <option value="mm">millimeter</option>
        <option value="cm" selected>centimeter</option>
        <option value="m">meter</option>
        <option value="km">kilometer</option>
        <option value="in">inch</option>
        <option value="ft">foot</option>
        <option value="yd">yard</option>
        <option value="mi">mile</option>
    </select>
</div>

<button id="convertBtn">Convert</button>
